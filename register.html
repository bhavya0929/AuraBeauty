<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | AuraBeauty</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <section class="auth-section">

        <div class="auth-container">

            <!-- LEFT SIDE -->
            <div class="auth-brand">

                <img src="IMAGE/logo.png"
                     alt="AuraBeauty"
                     class="auth-logo">

                <h1>Create Your Aura</h1>

                <p>
                    Join AuraBeauty and discover products
                    designed to enhance your natural glow.
                </p>

                <span>
                    Where Beauty Meets Confidence ✨
                </span>

            </div>


            <!-- RIGHT SIDE -->
            <div class="auth-form-container">

                <h2>Create Account</h2>

                <p class="auth-subtitle">
                    Create your account to start your beauty journey.
                </p>

                <form id="register-form">

                    <!-- FULL NAME -->
                    <div class="form-group">

                        <label for="register-name">
                            Full Name
                        </label>

                        <div class="input-box">

                            <i class="fa-regular fa-user"></i>

                            <input
                                type="text"
                                id="register-name"
                                placeholder="Enter your full name"
                                required>

                        </div>

                    </div>


                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="register-email">
                            Email Address
                        </label>

                        <div class="input-box">

                            <i class="fa-regular fa-envelope"></i>

                            <input
                                type="email"
                                id="register-email"
                                placeholder="Enter your email"
                                required>

                        </div>

                    </div>


                    <!-- PASSWORD -->
                    <div class="form-group">

                        <label for="register-password">
                            Password
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="register-password"
                                placeholder="Create a password"
                                required>

                            <button
                                type="button"
                                class="password-toggle"
                                onclick="togglePassword('register-password', this)">

                                <i class="fa-regular fa-eye"></i>

                            </button>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <div class="form-group">

                        <label for="confirm-password">
                            Confirm Password
                        </label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="confirm-password"
                                placeholder="Confirm your password"
                                required>

                            <button
                                type="button"
                                class="password-toggle"
                                onclick="togglePassword('confirm-password', this)">

                                <i class="fa-regular fa-eye"></i>

                            </button>

                        </div>

                    </div>


                    <!-- TERMS -->
                    <label class="terms">

                        <input type="checkbox" required>

                        <span>
                            I agree to the
                            <a href="#">Terms & Conditions</a>
                        </span>

                    </label>


                    <!-- REGISTER BUTTON -->
                    <button
                        type="submit"
                        class="auth-btn">

                        Create Account

                    </button>


                    <!-- LOGIN LINK -->
                    <p class="auth-switch">

                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>

                    </p>

                </form>

            </div>

        </div>

    </section>


    <script src="JS/app.js"></script>

</body>

</html>
